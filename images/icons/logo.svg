<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="logoTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Modern Follicle / Aesthetic Medical Emblem -->
  <g transform="translate(10, 8)">
    <circle cx="22" cy="22" r="22" fill="#f0fdfa"/>
    <circle cx="22" cy="22" r="20" stroke="url(#logoTeal)" stroke-width="2"/>
    <!-- Hair Follicle / Precision Strand Motif -->
    <path d="M 22 10 C 27 16 30 22 27 28 C 24 33 20 33 17 28 C 14 22 17 16 22 10 Z" fill="url(#logoTeal)"/>
    <path d="M 22 28 L 22 35" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="22" cy="35" r="2" fill="#0d9488"/>
  </g>
  <!-- Clinic Name Text -->
  <text x="64" y="27" fill="#0f172a" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.02em">AURA<tspan fill="#0d9488">HAIR</tspan></text>
  <text x="65" y="42" fill="#64748b" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.12em">RESTORATION CLINIC</text>
</svg>
