<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="beardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1727" />
      <stop offset="100%" stop-color="#1b2a4a" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#beardBg)"/>

  <!-- Male Jawline & Facial Contour Silhouette -->
  <path d="M 240 180 Q 240 320 280 400 Q 340 480 440 500 Q 520 480 560 400 Q 580 320 580 180" 
        fill="#1e293b" opacity="0.6"/>
  <path d="M 280 400 Q 340 480 440 500 Q 520 480 560 400" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4" fill="none"/>

  <!-- Beard & Mustache Density Strokes -->
  <g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round">
    <!-- Mustache -->
    <line x1="390" y1="360" x2="360" y2="380"/>
    <line x1="410" y1="360" x2="380" y2="382"/>
    <line x1="440" y1="360" x2="440" y2="385"/>
    <line x1="470" y1="360" x2="500" y2="382"/>
    <line x1="490" y1="360" x2="520" y2="380"/>
    <!-- Soul Patch -->
    <line x1="435" y1="410" x2="435" y2="430"/>
    <line x1="445" y1="410" x2="445" y2="430"/>
    <!-- Jawline & Chin Density -->
    <line x1="330" y1="420" x2="320" y2="440" stroke="#f59e0b"/>
    <line x1="360" y1="445" x2="350" y2="465" stroke="#f59e0b"/>
    <line x1="400" y1="465" x2="395" y2="485" stroke="#f59e0b"/>
    <line x1="440" y1="470" x2="440" y2="495" stroke="#f59e0b"/>
    <line x1="480" y1="465" x2="485" y2="485" stroke="#f59e0b"/>
    <line x1="520" y1="445" x2="530" y2="465" stroke="#f59e0b"/>
    <line x1="550" y1="420" x2="560" y2="440" stroke="#f59e0b"/>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 60)">
    <rect width="250" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="34" cy="32" r="18" fill="#d97706" opacity="0.2"/>
    <path d="M 27 32 L 32 37 L 42 27" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="64" y="27" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Beard &amp; Mustache</text>
    <text x="64" y="47" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Natural Facial Hair Direction</text>
  </g>
</svg>
