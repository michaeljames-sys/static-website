<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="dhiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b192c" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#dhiBg)"/>

  <!-- Background grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- Scalp Surface Layer with angle marker -->
  <path d="M 80 470 Q 400 440 720 470 L 720 540 L 80 540 Z" fill="#1e293b" opacity="0.8"/>
  <path d="M 80 470 Q 400 440 720 470" stroke="url(#cyanGrad)" stroke-width="4" fill="none"/>

  <!-- Angle arc representation -->
  <path d="M 400 450 A 60 60 0 0 0 455 425" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
  <text x="475" y="420" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="14" font-weight="600">40°- 45° Angle</text>

  <!-- Choi Implanter Pen at 45 degree angle -->
  <g transform="translate(380, 430) rotate(-45)">
    <!-- Hollow Needle Tip -->
    <polygon points="-3,-10 3,-10 0,-70" fill="#cbd5e1"/>
    <!-- Needle Channel holding graft -->
    <line x1="0" y1="-10" x2="0" y2="-60" stroke="#0284c7" stroke-width="2"/>
    <!-- Implanter Barrel Body -->
    <rect x="-14" y="-240" width="28" height="170" rx="6" fill="#334155"/>
    <rect x="-10" y="-220" width="20" height="40" rx="3" fill="#0f172a"/>
    <line x1="-8" y1="-150" x2="8" y2="-150" stroke="#38bdf8" stroke-width="3"/>
    <!-- Spring plunger trigger -->
    <rect x="-6" y="-300" width="12" height="60" rx="3" fill="#64748b"/>
    <rect x="-16" y="-310" width="32" height="10" rx="3" fill="#0284c7"/>
  </g>

  <!-- Natural Hair shafts positioned precisely -->
  <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round">
    <path d="M 200 465 Q 240 370 280 290"/>
    <path d="M 270 460 Q 315 365 350 280"/>
    <path d="M 330 455 Q 380 360 410 270"/>
    <!-- Newly inserted graft -->
    <path d="M 400 452 Q 445 360 480 275" stroke="#38bdf8" stroke-width="4.5"/>
    <path d="M 480 455 Q 525 360 560 280"/>
    <path d="M 550 460 Q 590 365 620 290"/>
    <path d="M 620 465 Q 655 375 680 300"/>
  </g>

  <!-- Information Badges -->
  <g transform="translate(60, 60)">
    <rect width="240" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="34" cy="32" r="18" fill="#0284c7" opacity="0.2"/>
    <text x="34" y="38" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="bold">DHI</text>
    <text x="64" y="27" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Direct Implantation</text>
    <text x="64" y="47" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">No Prior Incision Needed</text>
  </g>
  <g transform="translate(500, 60)">
    <rect width="240" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="34" cy="32" r="18" fill="#10b981" opacity="0.2"/>
    <text x="34" y="38" text-anchor="middle" fill="#34d399" font-size="16" font-weight="bold">MAX</text>
    <text x="64" y="27" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Precision Depth</text>
    <text x="64" y="47" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Control Angle &amp; Direction</text>
  </g>
</svg>
