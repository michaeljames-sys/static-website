<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="browBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131d" />
      <stop offset="100%" stop-color="#14283b" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#browBg)"/>

  <!-- Orbital bone & eye arch guideline -->
  <path d="M 160 420 Q 380 320 640 400" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
  
  <!-- Architectural Eyebrow Arch -->
  <path d="M 200 360 Q 420 280 500 290 Q 580 310 620 370" 
        stroke="url(#tealGrad)" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>

  <!-- Eyebrow Single Graft Micro Strokes mimicking delicate flat angle -->
  <g stroke="#e2e8f0" stroke-width="2" stroke-linecap="round">
    <!-- Head / Medial part (more upright 60 deg) -->
    <line x1="210" y1="365" x2="218" y2="340"/>
    <line x1="225" y1="362" x2="236" y2="336"/>
    <line x1="240" y1="358" x2="255" y2="333"/>
    <line x1="255" y1="355" x2="274" y2="330"/>

    <!-- Body / Central part (flatter 15-20 deg overlap) -->
    <line x1="275" y1="350" x2="310" y2="330" stroke="#2dd4bf"/>
    <line x1="300" y1="346" x2="340" y2="324" stroke="#2dd4bf"/>
    <line x1="325" y1="340" x2="370" y2="316" stroke="#2dd4bf"/>
    <line x1="350" y1="334" x2="400" y2="308" stroke="#2dd4bf"/>
    <line x1="380" y1="326" x2="435" y2="298" stroke="#2dd4bf"/>
    <line x1="410" y1="318" x2="470" y2="292" stroke="#2dd4bf"/>
    <line x1="440" y1="310" x2="500" y2="290" stroke="#2dd4bf"/>

    <!-- Arch & Tail (slanted downward confluence) -->
    <line x1="470" y1="305" x2="530" y2="300"/>
    <line x1="500" y1="302" x2="555" y2="312"/>
    <line x1="530" y1="310" x2="575" y2="330"/>
    <line x1="555" y1="322" x2="595" y2="348"/>
    <line x1="575" y1="340" x2="610" y2="368"/>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 60)">
    <rect width="250" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="34" cy="32" r="18" fill="#0d9488" opacity="0.2"/>
    <path d="M 27 32 L 32 37 L 42 27" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
    <text x="64" y="27" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Eyebrow Restoration</text>
    <text x="64" y="47" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Single Follicle Precision Angle</text>
  </g>
</svg>
