<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#scBg)"/>

  <!-- Trichology Digital Scalp Scanner Monitor Screen -->
  <rect x="140" y="80" width="520" height="360" rx="16" fill="#020617" stroke="#334155" stroke-width="4"/>
  <!-- Monitor stand -->
  <rect x="375" y="440" width="50" height="80" fill="#334155"/>
  <ellipse cx="400" cy="520" rx="90" ry="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- Screen UI HUD -->
  <rect x="160" y="100" width="480" height="40" rx="8" fill="#0f172a"/>
  <circle cx="185" cy="120" r="6" fill="#10b981"/>
  <text x="205" y="125" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Trichoscopy 100x Microscopic Analysis</text>

  <!-- Scalp Zoom Area -->
  <circle cx="280" cy="270" r="100" fill="#1e293b" stroke="#0d9488" stroke-width="3"/>
  <g stroke="#2dd4bf" stroke-width="2.5">
    <line x1="260" y1="230" x2="250" y2="290"/>
    <line x1="280" y1="220" x2="275" y2="295"/>
    <line x1="300" y1="235" x2="310" y2="300"/>
    <circle cx="275" cy="295" r="5" fill="#0d9488"/>
  </g>
  <circle cx="280" cy="270" r="70" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <!-- Analytics Metrics Panel -->
  <g transform="translate(420, 160)">
    <rect width="200" height="220" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="30" fill="#94a3b8" font-size="11" font-family="'Inter', sans-serif">DONOR DENSITY</text>
    <text x="16" y="55" fill="#38bdf8" font-size="18" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">85 FUs / cm²</text>
    
    <text x="16" y="90" fill="#94a3b8" font-size="11" font-family="'Inter', sans-serif">MINIATURIZATION</text>
    <text x="16" y="115" fill="#f59e0b" font-size="18" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">Normal (&lt; 10%)</text>
    
    <text x="16" y="150" fill="#94a3b8" font-size="11" font-family="'Inter', sans-serif">TARGET GRAFT PLAN</text>
    <text x="16" y="175" fill="#10b981" font-size="18" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">Personalized</text>
  </g>
</svg>
