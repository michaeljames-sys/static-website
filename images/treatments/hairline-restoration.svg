<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="hlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091421" />
      <stop offset="50%" stop-color="#112233" />
      <stop offset="100%" stop-color="#162e47" />
    </linearGradient>
    <linearGradient id="hlTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#hlBg)"/>

  <!-- Male Face Profile Outline (Forehead & Temple) -->
  <path d="M 180 550 C 180 480 200 400 240 330 C 270 280 320 220 400 180 C 500 130 620 140 680 220 C 720 270 730 350 710 420" 
        fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Golden Ratio Aesthetic Caliper & Guidelines -->
  <line x1="240" y1="200" x2="680" y2="200" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="300" y1="260" x2="650" y2="260" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="400" cy="180" r="6" fill="#2dd4bf"/>
  <text x="415" y="185" fill="#2dd4bf" font-family="'Inter', sans-serif" font-size="13">Trichion Point (Apex)</text>

  <!-- Natural Hairline Micro-Irregularities -->
  <path d="M 230 360 C 260 320 290 290 320 270 C 350 250 380 230 400 230 C 430 230 460 250 490 270 C 530 295 560 330 590 370" 
        fill="none" stroke="url(#hlTeal)" stroke-width="4"/>

  <!-- Single Hair Soft Transition Zone -->
  <g fill="#2dd4bf" opacity="0.85">
    <circle cx="280" cy="310" r="3"/>
    <circle cx="295" cy="295" r="3.5"/>
    <circle cx="310" cy="285" r="3"/>
    <circle cx="330" cy="270" r="3.5"/>
    <circle cx="350" cy="255" r="3"/>
    <circle cx="370" cy="245" r="4"/>
    <circle cx="390" cy="235" r="3.5"/>
    <circle cx="410" cy="235" r="3.5"/>
    <circle cx="430" cy="245" r="4"/>
    <circle cx="450" cy="255" r="3"/>
    <circle cx="470" cy="270" r="3.5"/>
    <circle cx="490" cy="285" r="3"/>
    <circle cx="510" cy="300" r="3.5"/>
    <circle cx="530" cy="320" r="3"/>
  </g>

  <!-- Multi-hair density core behind hairline -->
  <g fill="#0284c7" opacity="0.65">
    <circle cx="300" cy="250" r="4"/>
    <circle cx="330" cy="230" r="4"/>
    <circle cx="360" cy="210" r="4"/>
    <circle cx="400" cy="200" r="4.5"/>
    <circle cx="440" cy="210" r="4"/>
    <circle cx="470" cy="230" r="4"/>
    <circle cx="500" cy="250" r="4"/>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 60)">
    <rect width="250" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="34" cy="32" r="18" fill="#0d9488" opacity="0.2"/>
    <path d="M 27 32 L 32 37 L 42 27" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
    <text x="64" y="27" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Artistic Hairline Design</text>
    <text x="64" y="47" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Natural Micro-Irregularity</text>
  </g>
</svg>
