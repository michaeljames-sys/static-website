<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="prpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1727" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldPlasma" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="plasmaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#prpBg)"/>
  <circle cx="400" cy="320" r="220" fill="url(#plasmaGlow)"/>

  <!-- Centrifuge Test Tube with Separated Plasma Layers -->
  <g transform="translate(360, 160)">
    <!-- Glass Tube Outline -->
    <path d="M 0 0 L 80 0 L 80 240 C 80 280 0 280 0 240 Z" fill="none" stroke="#64748b" stroke-width="4"/>
    <rect x="-6" y="-12" width="92" height="14" rx="4" fill="#475569"/>

    <!-- Red Blood Cells (bottom) -->
    <path d="M 4 190 L 76 190 L 76 240 C 76 274 4 274 4 240 Z" fill="#991b1b" opacity="0.85"/>
    <!-- Buffy Coat (leukocytes + platelets) -->
    <rect x="4" y="180" width="72" height="10" fill="#f8fafc" opacity="0.8"/>
    <!-- Platelet-Rich Plasma (golden mid-top layer) -->
    <rect x="4" y="50" width="72" height="130" fill="url(#goldPlasma)" opacity="0.85"/>
    <text x="96" y="115" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Autologous Growth Factors</text>
    <text x="96" y="135" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Active PRP Concentration</text>
  </g>

  <!-- Cellular stimulation particles -->
  <g fill="#fbbf24" opacity="0.7">
    <circle cx="220" cy="340" r="6"/>
    <circle cx="250" cy="380" r="4"/>
    <circle cx="280" cy="310" r="5"/>
    <circle cx="540" cy="340" r="6"/>
    <circle cx="580" cy="380" r="4"/>
    <circle cx="510" cy="300" r="5"/>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 60)">
    <rect width="250" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="34" cy="32" r="18" fill="#d97706" opacity="0.2"/>
    <path d="M 27 32 L 32 37 L 42 27" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <text x="64" y="27" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">PRP Hair Therapy</text>
    <text x="64" y="47" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Natural Cellular Revitalization</text>
  </g>
</svg>
